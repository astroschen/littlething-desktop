<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小叽 · 桌宠</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .chip {
    position: absolute;
    transform: translate(-50%, -100%);
    padding: 0 6px;
    border-radius: 6px;
    background: #fffdf4;
    border: 1.5px solid #17171b;
    color: #17171b;
    font: 700 13px ui-rounded, "PingFang SC", "Microsoft YaHei", sans-serif;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 4;
  }
  .zzz { position: absolute; pointer-events: none; display: none; font-family: ui-rounded, "PingFang SC", sans-serif; font-weight: 700; color: #17171b; z-index: 3; }
  .zzz span { position: absolute; left: 0; top: 0; opacity: 0; font-size: 1em; line-height: 1; transform-origin: 0 100%; animation: zfloat 3.3s linear infinite; }
  .zzz span:nth-child(2) { animation-delay: 1.1s; }
  .zzz span:nth-child(3) { animation-delay: 2.2s; }
  @keyframes zfloat {
    0% { opacity: 0; transform: translate(0, 0) scale(.28); }
    12% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(1.4em, -2.6em) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .zzz span { animation: none; opacity: 1; } }
</style>
</head>
<body>
  <div id="stage"></div>
  <script src="./assets/three.min.js"></script>
<script src="./assets/skins.js"></script>
  <script src="./assets/cat.js"></script>
  <script src="./pet.js"></script>
</body>
</html>
