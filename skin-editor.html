<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小叽 · 自定义皮肤</title>

<!-- 全局共享的主题变量（设置窗口 / 右键菜单也用这一份） -->
<link rel="stylesheet" href="./assets/ui-theme-vars.css">
<!-- 结构层：只管布局（两栏、Tab、折叠分组） -->
<link rel="stylesheet" href="./assets/skin-editor.css">
<!-- 主题层：两套视觉语言，按 data-skin-ui 属性门控 -->
<link rel="stylesheet" href="./assets/editor-themes.css">

<style>
  /* 页面外壳。编辑器本身的两栏布局全在 skin-editor.css 里，
     这里只负责把它放到一个像样的窗口里。

     网页版的编辑器是一个 <dialog>，外面套着标题（「自定义皮肤」+
     副标题）和一圈描边。桌面版是独立窗口，没有 dialog 可用，但外壳
     必须长得一样 —— 否则两端摆在一起会像两个不同的程序。

     ⚠️ 外壳的颜色是**跟着界面风格走**的：
     液态玻璃要靠背后有内容才磨得出层次（纯色背景 = 一块灰玻璃），
     涂鸦则要暖纸色才像涂鸦本。所以这里给两套各准备一个背景，
     用 <body data-shell="..."> 切换。 */
  :root {
    --ink: #17171b;
    --ink-soft: #4b4636;
    --key: #fffdf4;
    --display: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 16px 18px 20px;
    color: var(--ink);
    font: 14px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: auto;
    transition: background .25s ease;
  }

  /* ⚠️⚠️ 高度链必须是**确定**的：视口 → 外壳 → 编辑器 → 网格行 → 舞台。
   *
   *   原来的写法：body 有 padding + overflow:auto，而 #skin-editor-host 是
   *   `min-height:100%`。`min-height:100%` 的百分比是相对**父元素的内容高**
   *   解析的，而父元素（.skin-shell）的高度又是**内容撑出来的** ——
   *   于是形成一条「内容 ↔ 百分比高度」的循环，浏览器只能按内容猜。
   *
   *   猜出来的结果就是用户看到的那个 bug：
   *     窗口拖大 → 内容高 → 宿主 min-height 变大 → 再拖大…
   *     窗口拖小 → 宿主的 min-height 还停在那个大值 → **高度变高了**。
   *
   *   改法：把整条链改成**弹性布局**，每一环都明确「我占满剩余空间」。
   *     body 是唯一的滚动容器，里面是 flex column；
   *     .skin-shell 撑满可用高度；编辑器再 flex:1；
   *     .sk-body 的网格行用 `minmax(0, 1fr)` 而不是 `auto` ——
   *     `auto` 会被内容（= canvas 固有高）撑开，`minmax(0,1fr)` 不会。
   *
   *   这样高度只由**视口**决定，拖大拖小都严格跟随，绝不残留。
   */
  body {
    display: flex;
    flex-direction: column;
  }

  /* ---- 液态玻璃：背后要有渐变，玻璃才有东西可磨 ----
     ⚠️ 直接用共享变量 --ui-page-bg（assets/ui-theme-vars.css）——
        设置页用的是同一份，两处背景观感必然一致。
        以前这里是手写的一份 px 半径渐变，跟设置页那份是「抄的」，
        改一处忘另一处就会出现「两个窗口背景不一样」。 */
  body[data-shell="glass"] {
    background: var(--ui-page-bg);
  }
  /* ---- 卡通涂鸦：暖纸色，像翻开的涂鸦本 ---- */
  body[data-shell="doodle"] {
    background: #fff8e7;
  }

  /* 和网页版 dialog 的 .skin-dialog 一样：两像素描边、圆角、硬阴影。 */
  .skin-shell {
    /* ⚠️ flex:1 —— 撑满 body 的可用高度（减去 padding）。
       配合下面的 display:flex，编辑器就能按剩余空间分。 */
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--key);
    border: 2px solid var(--ink);
    border-radius: 18px;
    box-shadow: 0 10px 0 rgba(23,23,27,.2);
    padding: 16px 18px 18px;
    transition: background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  /* 玻璃主题下，外壳自己也变成一块玻璃 */
  body[data-shell="glass"] .skin-shell {
    background: rgba(255, 255, 255, .42);
    backdrop-filter: blur(20px) saturate(170%);
    -webkit-backdrop-filter: blur(20px) saturate(170%);
    border-color: rgba(255, 255, 255, .72);
    box-shadow:
      0 1px 0 0 rgba(255,255,255,.72) inset,
      0 16px 40px rgba(0,0,0,.12);
  }
  /* 涂鸦主题下，外壳是白纸 + 硬阴影 */
  body[data-shell="doodle"] .skin-shell {
    background: #fffdf4;
    border-color: #2b2118;
    border-radius: 20px 12px 22px 14px / 14px 22px 12px 20px;
    box-shadow: 5px 5px 0 rgba(43,33,24,.18);
  }

  .skin-dialog-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
  }
  .skin-dialog-head h2 { font: 700 18px/1.3 var(--display); margin: 0; }
  .skin-dialog-head p { margin: 0; font-size: 13px; color: var(--ink-soft); }

  #skin-editor-host {
    /* ⚠️ 原来是 `min-height:100%` —— 百分比高度在「父高由内容决定」的
       情况下是循环引用，浏览器只能猜，猜出来就是用户看到的高度失控。
       改成 flex:1 + min-height:0，让编辑器去**占满外壳的剩余空间**，
       高度就只由视口决定了。 */
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body data-shell="glass">
  <div class="skin-shell">
    <div class="skin-dialog-head">
      <h2>自定义皮肤</h2>
      <p>改配色、拉体型、用画笔涂花纹 —— 右边看着画，左边立刻就变。</p>
    </div>
    <div id="skin-editor-host"></div>
  </div>

  <!-- 加载顺序有讲究：
       skins.js      —— 皮肤数据（配色、花纹、比例表），编辑器和存储层都要用
       skin-store.js —— 皮肤的存取（这里是磁盘文件，网页版是 localStorage）
       skin-editor.js– 编辑器面板本身
       cat.js        —— 3D 小猫（编辑器里的预览猫就是它造的）
       editor.js     —— 把它们接到一起
  -->
  <script src="./assets/three.min.js"></script>
  <script src="./assets/skins.js"></script>
  <script src="./assets/skin-store.js"></script>
  <script src="./assets/skin-editor.js"></script>
  <script src="./assets/cat.js"></script>
  <script src="./editor.js"></script>
</body>
</html>
