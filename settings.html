<!doctype html>
<html lang="zh-CN" data-skin-ui="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小叽 · 设置</title>

<!-- ⚠️ 这段内联脚本要放在**样式表之前** ——
     主题属性必须在第一帧渲染前就设好。
     主进程加载这个页面时把当前风格写进了 ?theme=glass / ?theme=doodle，
     这里读出来打到 <html> 上。
     放在 <body> 末尾的 settings.js 里做同样的事就晚了 —— 那时浏览器
     已经画过第一帧，用户会看到窗口闪一下玻璃色才跳成涂鸦。 -->
<script>
  (function () {
    try {
      var q = new URLSearchParams(location.search).get('theme');
      document.documentElement.setAttribute('data-skin-ui',
        q === 'doodle' ? 'doodle' : 'glass');
    } catch (_) {}
  })();
</script>

<!-- 全局共享的主题变量（设置窗口 / 皮肤编辑器 / 右键菜单也用这一份） -->
<link rel="stylesheet" href="./assets/ui-theme-vars.css">
<!-- 结构层：只管布局 -->
<link rel="stylesheet" href="./assets/settings-core.css">
<!-- 主题层：两套视觉语言，按 data-skin-ui 属性门控 -->
<link rel="stylesheet" href="./assets/settings-themes.css">

<style>
  /* 页面外壳。设置页本身的内容全在 settings-core.css 里，
     这里只负责把它放到一个像样的窗口里。

     ⚠️ 外壳的颜色是**跟着界面风格走**的：
     液态玻璃要靠背后有内容才磨得出层次（纯色背景 = 一块灰玻璃），
     涂鸦则要暖纸色才像涂鸦本。所以用 [data-skin-ui] 切换。 */
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--ui-page-bg);
    /* ⚠️ background-attachment: fixed —— 渐变按**视口**铺，而不是按元素盒子。
       设置页内容比窗口高（要滚动）。默认的 `scroll` 模式下，
       背景是跟着 body 的盒子走的，滚动时色块会「飘」过去，
       滚动到下面还能看到色块被切断的边 —— 这也是「拼接感」的一半来源。
       fixed 之后背景钉在视口上，滚动时它纹丝不动，就像一块真的底板。 */
    background-attachment: fixed;
    color: var(--ui-text);
    font: 14px/1.6 system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    overflow: auto;
    transition: background .25s ease;
  }
  /* 兜底：万一共享变量没加载上，页面至少还有底色，不会白底乱掉 */
  body:not([data-skin-ui]) { background: #f6f7fb; }
</style>
</head>
<body data-skin-ui="glass">
  <div class="settings-root" id="settingsRoot" data-skin-ui="glass">
    <div class="head">
      <img class="logo" src="assets/icons/logo.png" alt="">
      <div class="txt">
        <h1 data-i18n="title">小叽 · 桌宠设置</h1>
        <p class="sub" data-i18n="subtitle">设置保存在本机，重启后依然生效。</p>
      </div>
    </div>

    <div class="group">
      <h2 data-i18n="appearance">外观</h2>
      <!-- 界面风格：管的是整页长什么样，所以放在外观分组最上面。 -->
      <label class="row"><span data-i18n="uiTheme">界面风格</span>
        <span class="ui-switch" id="uiSwitch" role="group">
          <button class="ui-btn" type="button" data-theme="glass"
                  aria-label="液态玻璃风格" aria-pressed="true" title="液态玻璃风格">
            <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor" opacity=".18"/>
              <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/>
              <path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="7.5" cy="6" r="1.2" fill="currentColor"/>
            </svg>
          </button>
          <button class="ui-btn" type="button" data-theme="doodle"
                  aria-label="卡通涂鸦风格" aria-pressed="false" title="卡通涂鸦风格">
            <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 17c2-6 4-9 8-9s6 3 8 9" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round"/>
              <path d="M7 19c1.5-2 3-3 5-3s3.5 1 5 3" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" opacity=".55"/>
              <circle cx="8" cy="8" r="2" fill="currentColor"/>
            </svg>
          </button>
        </span>
      </label>
      <label class="row"><span data-i18n="language">界面语言</span>
        <select id="language">
          <option value="zh">简体中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="row"><span data-i18n="coat">毛色</span>
      <!-- 皮肤列表由 assets/skins.js 的 COATS 生成，不再硬编码在这里。
           设置页不再维护第二份皮肤清单 —— 单一数据源。
           用户自己的皮肤也会并进这个下拉框（见 settings.js）。 -->
      <select id="coat"></select>
    </label>
    <label class="row"><span data-i18n="customSkin">自定义皮肤</span>
      <button id="openSkinEditor" type="button" data-i18n="customSkinEdit">✎ 编辑皮肤…</button>
    </label>
    <!-- 演示窗口的入口。
         ⚠️ 右键菜单里的「打开演示窗口」已经去掉了（用户要求），
           所以这里成了唯一的入口 —— 不留的话用户就再也打不开演示窗口了。 -->
    <label class="row"><span data-i18n="demoWindow">演示窗口</span>
      <button id="openDemo" type="button" data-i18n="demoWindowOpen">打开演示窗口…</button>
    </label>
    <!-- 用户自己做的皮肤。空的时候这一行不出现。 -->
    <div id="mySkinsRow" hidden>
      <div class="myskins" id="mySkins"></div>
    </div>
    <label class="row"><span data-i18n="showKeyboard">显示键盘</span><input id="showKeyboard" type="checkbox"></label>
    <label class="row"><span data-i18n="showMouse">显示鼠标</span><input id="showMouse" type="checkbox"></label>
    <label class="row"><span data-i18n="leftMouse">左手鼠标布局</span><input id="leftMouse" type="checkbox"></label>
    <label class="row"><span data-i18n="autoDemo">演示模式（自动打字）</span><input id="autoDemo" type="checkbox"></label>
    <label class="row"><span data-i18n="globalKeys">全局键盘跟随</span><input id="globalKeys" type="checkbox"></label>
    <label class="row"><span data-i18n="globalMouse">全局鼠标跟随</span><input id="globalMouse" type="checkbox"></label>
    <!-- 「允许鼠标躁动」：手边那只鼠标要不要自己乱晃一点。
         强度滑杆是它的子控件 —— 开关没开时不该占地方，也没法预览效果。 -->
    <label class="row"><span data-i18n="mouseJitter">允许鼠标躁动</span><input id="mouseJitter" type="checkbox"></label>
    <label class="row sub" id="mouseJitterAmountRow" hidden><span data-i18n="mouseJitterAmount">躁动强度</span>
      <input id="mouseJitterAmount" type="range" min="0" max="100" step="5"><span class="val" id="mouseJitterAmountVal"></span>
    </label>
    <!-- 全局输入状态。只有当跟随「开了但没生效」或「平台不支持」时才显示。
         一直显示会让页面很吵 —— 正常时不占地方。 -->
    <div class="inputStatus" id="inputStatus">
      <div class="st-title"><span class="dot"></span><span id="inputStatusTitle"></span></div>
      <div class="st-detail" id="inputStatusDetail"></div>
      <button id="inputStatusAction" type="button" hidden></button>
    </div>
  </div>

  <div class="group">
    <h2 data-i18n="behavior">行为</h2>
    <label class="row"><span data-i18n="sleepMinutes">入睡等待（分钟）</span>
      <input id="sleepMinutes" type="range" min="1" max="10" step="0.5"><span class="val" id="sleepMinutesVal"></span>
    </label>
    <label class="row"><span data-i18n="scale">窗口大小</span>
      <input id="scale" type="range" min="0.6" max="1.6" step="0.05"><span class="val" id="scaleVal"></span>
    </label>
    <label class="row"><span data-i18n="opacity">不透明度</span>
      <input id="opacity" type="range" min="0.4" max="1" step="0.05"><span class="val" id="opacityVal"></span>
    </label>
    <label class="row"><span data-i18n="alwaysOnTop">永远置顶</span><input id="alwaysOnTop" type="checkbox"></label>
    <label class="row"><span data-i18n="autoLaunch">开机自动启动</span><input id="autoLaunch" type="checkbox"></label>
    <label class="row"><span data-i18n="allowDrag">允许拖动猫咪</span><input id="allowDrag" type="checkbox"></label>
    <label class="row"><span data-i18n="secretMode">保密模式（输密码时扭头不看）</span><input id="secretMode" type="checkbox"></label>
    <label class="row"><span data-i18n="debug">启用诊断日志</span><input id="debug" type="checkbox"></label>
  </div>

  <div class="actions">
    <button id="save" class="primary" data-i18n="save">保存</button>
    <button id="cancel" data-i18n="cancel">取消</button>
    <button id="resetPosition" data-i18n="resetPosition">重置位置</button>
  </div>
  <p class="tip" data-i18n="tip">提示：按住猫咪本体拖动即可移动位置（可在下方「允许拖动猫咪」中关闭）；托盘图标右键可显示/隐藏或退出。按 Ctrl+Alt+S 随时打开本窗口。全局输入跟随只读取键位与鼠标按键/移动用于驱动动画，不记录输入内容，可随时关闭。保密模式只向系统询问「当前焦点是不是密码框」，绝不读取密码内容，保密期间小键盘也不会显示任何字符。</p>

  <script src="./assets/skins.js"></script>
  <script src="./assets/skin-store.js"></script>
  <script src="./settings.js"></script>
</body>
</html>
